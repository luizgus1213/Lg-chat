<section id="authArea" class="auth-page">
  <div class="auth-wrapper">
    <div class="brand">
      <div class="brand-logo">LG</div>
      <h1>LG Chat</h1>
      <p>Converse em tempo real com segurança.</p>
    </div>

    <div class="auth-grid">
      <form id="loginForm" class="auth-card">
        <h2>Entrar</h2>
        <p class="muted">Acesse sua conta para continuar.</p>

        <label>
          Email
          <input
            id="loginEmail"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
          />
        </label>

        <label>
          Senha
          <input
            id="loginSenha"
            type="password"
            placeholder="Sua senha"
            autocomplete="current-password"
          />
        </label>

        <button type="submit" class="primary-button">Entrar</button>
      </form>

      <form id="registerForm" class="auth-card">
        <h2>Criar conta</h2>
        <p class="muted">Crie uma conta para testar o chat.</p>

        <label>
          Nome
          <input id="registerNome" placeholder="Seu nome" autocomplete="name" />
        </label>

        <label>
          Email
          <input
            id="registerEmail"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
          />
        </label>

        <label>
          Senha
          <input
            id="registerSenha"
            type="password"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
          />
        </label>

        <button type="submit" class="secondary-button">Criar conta</button>
      </form>

      <form id="emailVerificationForm" class="auth-card hidden">
        <h2>Verificar email</h2>
        <p class="muted">
          Enviamos um código de 6 dígitos para seu email.
        </p>

        <label>
          Email
          <input
            id="verificationEmail"
            type="email"
            readonly
            autocomplete="email"
          />
        </label>

        <label>
          Código
          <input
            id="emailVerificationCode"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
          />
        </label>

        <button id="verifyEmailButton" type="submit" class="primary-button">
          Verificar email
        </button>

        <button
          id="resendVerificationCodeButton"
          type="button"
          class="secondary-button"
        >
          Reenviar código
        </button>

        <button
          id="backToRegisterButton"
          type="button"
          class="ghost-button"
        >
          Trocar email
        </button>
      </form>
    </div>
  </div>
</section>
