<div id="chatBlockNotice" class="chat-block-notice hidden"></div>

  <div id="messages" class="messages empty-state">
    <div>
      <h3>Bem-vindo ao LG Chat</h3>
      <p>Crie um grupo ou escolha uma conversa para começar.</p>
    </div>
  </div>

  <div id="typingText" class="typing-text"></div>

  <div id="replyBar" class="reply-bar hidden">
    <div class="reply-info">
      <strong id="replyAuthor">Respondendo</strong>
      <span id="replyPreview">Mensagem selecionada</span>
    </div>

    <button id="cancelReplyButton" type="button" class="reply-cancel-button">
      ×
    </button>
  </div>

  <div id="editingBar" class="editing-bar hidden">
    <div class="editing-info">
      <strong>Editando mensagem</strong>
      <span id="editingPreview">Mensagem selecionada</span>
    </div>

    <button id="cancelEditButton" type="button" class="editing-cancel-button">
      ×
    </button>
  </div>
