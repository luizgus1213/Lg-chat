<div id="forwardMessageModal" class="forward-message-modal modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content forward-message-panel">
      <header class="forward-message-header">
        <div>
          <h3>Encaminhar mensagem</h3>
          <p id="forwardMessagePreview">Mensagem selecionada</p>
        </div>

        <button id="closeForwardMessageButton" type="button" class="icon-button">
          ×
        </button>
      </header>

      <div class="forward-message-body">
        <p class="muted">Escolha uma ou mais conversas:</p>
        <div id="forwardChatsList" class="forward-chats-list"></div>
      </div>

      <footer class="forward-message-actions">
        <button id="cancelForwardMessageButton" type="button" class="ghost-button">
          Cancelar
        </button>

        <button id="sendForwardMessageButton" type="button">
          Encaminhar
        </button>
      </footer>
    </div>
  </div>
